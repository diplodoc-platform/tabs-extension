name: Integration

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parent-e2e:
    name: Full E2E
    uses: diplodoc-platform/diplodoc/.github/workflows/e2e-tests.yaml@master
    with:
      candidate_repository: ${{ github.repository }}
      candidate_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      trigger_id: ${{ format('{0}-{1}', github.event.repository.name, github.run_id) }}

  trigger-parent-e2e:
    name: Run tests
    needs: parent-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful full E2E
        env:
          E2E_RESULT: ${{ needs.parent-e2e.result }}
        run: |
          echo "Full E2E result: $E2E_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$E2E_RESULT" = success
